<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App | Login</title>
    <link rel="stylesheet" type="text/css" href="todoLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Fleur De Leah' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Arsenal' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="bgContainer">
    <div id="col1" class="col"></div>
    <div id="col2" class="col"></div>
    <div id="col3" class="col"></div>
    <div id="col4" class="col"></div>
</div>

<div id="foreContainer">
    <main-nav-comp data-direction="left" data-active-page="to-dos">
        <h1 slot="navHeaderTitle">To-Dos</h1>
    </main-nav-comp>
    <div id="content">
        <div id="header">
            <p>To-Dos</p>
            <img class="underlineMask" src="./files/img_transparent.gif" alt="">
        </div>
        <div id="formContainer">
            <div id="loginBox">
                <div>Sign In</div>
                <p>Keep it all together and you'll be fine.</p>
                <form>
                    <div id="input1bg">
                        <div></div>
                        <input type="text" placeholder="Email">
                    </div>
                    <div id="input2bg">
                        <div></div>
                        <input type="password" placeholder="Password">
                    </div>
                    <a id="forgotPass" href="#"><code>Forgot Password</code></a>
                    <button id="f1btn1">Sign In</button>
                    <hr>
                    <hr>
                    <div id="lineOver">or</div>
                    <button id="f1btn2">Sign In with Google</button>
                    <div>New to us? <a href="#">Join Now</a></div>
                </form>
            </div>
            <div id="signupBox">
                <div>Sign Up</div>
                <p>Keep it all together and you'll be fine.</p>
                <form>
                    <div id="f2input1bg">
                        <div></div>
                        <input type="text" placeholder="Email">
                    </div>
                    <div id="f2input2bg" title="Passwords must be 8-32 characters, containing at least one: lowercase and uppercase letters, number, and symbol.">
                        <div></div>
                        <input type="password" placeholder="Password">
                        <br>
                    </div>
                    <div id="f2input3bg">
                        <div></div>
                        <input type="password" placeholder="Repeat Password">
                    </div>
                    <button id="f2btn1">Sign Up</button>
                    <hr>
                    <hr>
                    <div id="f2lineOver">or</div>
                    <button id="f2btn2">Sign Up with Google</button>
                    <div>Already a member? <a href="#">Log In Now</a></div>
                </form>
                <!--<p>* 8-32 characters with uppercase and lowercase letters, numbers, and symbols.</p>-->
            </div>
            <div id="modal" style="opacity: 0">
                <div></div><!--Modal Parent Pointer-->
                <p></p><!--Modal Message-->
                <div></div><!--Timer Bar-->
            </div>
        </div>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js" defer crossorigin></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js" defer crossorigin></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js" defer crossorigin></script>
<script src="todoApp.js" type="module" defer></script>
<script src="todoLogin.js" type="module"></script>
</body>
</html>
